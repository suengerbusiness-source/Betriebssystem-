name: Erinnerungen senden

# Verschickt zeitgesteuerte Erinnerungen an dein privates ntfy-Thema – kommt
# auch bei geschlossener App auf dem Handy an (ntfy-App). Kostenlos, kein Server.
#
# Voraussetzung: Secret NTFY_TOPIC = dein geheimes Thema (gleiches wie in der
# ntfy-App abonniert). Ohne Secret passiert nichts.
#
# Hinweis: GitHub-Cron läuft in UTC. Deutschland = UTC+2 (Sommer) / UTC+1 (Winter).
on:
  schedule:
    - cron: "0 18 * * *"   # ~20:00 (Sommer) – Abend-Check-in
    - cron: "0 17 * * 0"   # Sonntag ~19:00 – Wochenrückblick
  workflow_dispatch:
    inputs:
      message:
        description: "Optionaler Text für eine sofortige Test-Erinnerung"
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerung senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DOW: ${{ github.event.schedule }}
          MANUAL_MSG: ${{ inputs.message }}
        run: |
          set -e
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Kein NTFY_TOPIC gesetzt – übersprungen."
            exit 0
          fi

          if [ -n "$MANUAL_MSG" ]; then
            TITLE="Life-OS"; TAGS="bell"; MSG="$MANUAL_MSG"
          elif [ "$DOW" = "0 17 * * 0" ]; then
            TITLE="Wochenrückblick"; TAGS="calendar"
            MSG="Nimm dir 10 Minuten: Woche reflektieren, nächste planen. 🧭"
          else
            TITLE="Abend-Check-in"; TAGS="memo"
            MSG="Wie war dein Tag? Kurzer Check-in im Tagebuch. 📓"
          fi

          curl -fsS \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: https://suengerbusiness-source.github.io/Betriebssystem-/" \
            -d "$MSG" \
            "https://ntfy.sh/${NTFY_TOPIC}"
          echo "Gesendet: $TITLE"
