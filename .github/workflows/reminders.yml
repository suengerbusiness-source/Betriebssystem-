name: Erinnerungen senden

# Verschickt Erinnerungen mit Charakter (strenger Coach) an dein privates
# ntfy-Thema – kommt auch bei geschlossener App auf dem Handy an. Kostenlos.
#
# Voraussetzung: Secret NTFY_TOPIC = dein geheimes Thema. Ohne Secret: nichts.
#
# Tonfall: knapp, fordernd, motivierend – soll dich in die App holen, nicht
# nerven. Texte werden je Lauf ZUFÄLLIG aus einem Pool gewählt (nie derselbe
# Spruch). Der Mittags-Kick feuert nur manchmal (Zufall), damit es nicht naggt.
#
# Hinweis: GitHub-Cron läuft in UTC. Deutschland = UTC+2 (Sommer)/UTC+1 (Winter).
# Wichtig: Zur vollen Stunde (Minute 0) ist GitHub-Cron oft stark verspätet –
# darum eine krumme Minute wählen. Dieser Server-Cron ist der Fallback für alle,
# die die App gerade nicht offen hatten; die genaue, an den Check-in gekoppelte
# 20:00-/22:00-Erinnerung plant die App selbst per ntfy (checkinReminders.ts).
on:
  schedule:
    - cron: "9 18 * * *"     # ~20:09 – Abend-Check-in (täglich)
    - cron: "9 20 * * *"     # ~22:09 – letzte Erinnerung, falls noch offen
    - cron: "9 17 * * 0"     # So ~19:09 – Wochenrückblick
    - cron: "9 12 * * 1-5"   # ~14:09 – Zufalls-Kick (nur manchmal)
  workflow_dispatch:
    inputs:
      message:
        description: "Optionaler eigener Text (sonst zufälliger Coach-Spruch)"
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Coach meldet sich
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCHED: ${{ github.event.schedule }}
          MANUAL_MSG: ${{ inputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "Kein NTFY_TOPIC gesetzt – übersprungen."
            exit 0
          fi

          pick () { local -n a=$1; echo "${a[$((RANDOM % ${#a[@]}))]}"; }

          CHECKIN=(
            "Tag vorbei. Zahlen auf den Tisch – Check-in. Keine Ausreden."
            "Wie war dein Tag WIRKLICH? Trag es ein. Ich sehe alles."
            "Disziplin schlägt Motivation. Mach deinen Check-in. Jetzt."
            "Kein Check-in, kein Fortschritt. Du weißt, was zu tun ist."
            "Andere reden, du lieferst. 60 Sekunden Check-in. Los."
            "Schwacher Tag oder starker Tag? Beweis es im Tagebuch."
            "Ich warte auf deinen Check-in. Lass mich nicht warten."
          )
          LATE=(
            "Letzte Erinnerung: Check-in noch offen? Jetzt, bevor der Tag rum ist."
            "22 Uhr. Wenn der Check-in noch fehlt – zieh ihn durch. Sofort."
            "Bevor du schlafen gehst: 60 Sekunden Check-in. Dann Feierabend."
            "Noch wach, noch kein Eintrag? Das holen wir jetzt nach."
          )
          WEEKLY=(
            "Woche vorbei. Bilanz ziehen – oder weiter im Blindflug?"
            "7 Tage. Was hast du wirklich bewegt? Wochenrückblick. Jetzt."
            "Champions reviewen. Hinsetzen: Woche aus, nächste planen."
            "Keine Ausreden für nächste Woche. Plan sie – heute."
            "Rückblick fällig. Ehrlich zu dir selbst sein – los."
          )
          KICK=(
            "Kurzer Test: gerade produktiv oder nur beschäftigt? App auf."
            "Ich hab nachgesehen. Deine Ziele warten nicht. Du?"
            "5 Minuten Fokus jetzt schlagen 1 Stunde später. Beweg dich."
            "Stillstand ist Rückschritt. Was ist dein nächster Move?"
            "Random-Check: 3 Dinge heute erledigt? Wenn nein – ran."
            "Ich teste dich. App auf und zeig mir Fortschritt."
            "Komfortzone gesehen. Verlass sie. Eine Aufgabe – sofort."
          )

          TAGS="muscle"
          if [ -n "${MANUAL_MSG:-}" ]; then
            TITLE="Coach"; MSG="$MANUAL_MSG"
          elif [ "${SCHED:-}" = "9 17 * * 0" ]; then
            TITLE="Coach: Wochenrückblick"; TAGS="calendar"; MSG="$(pick WEEKLY)"
          elif [ "${SCHED:-}" = "9 12 * * 1-5" ]; then
            # Zufalls-Kick: nur in ~40% der Fälle feuern.
            if [ $((RANDOM % 100)) -ge 40 ]; then
              echo "Kick heute übersprungen (Zufall)."; exit 0
            fi
            TITLE="Coach"; TAGS="zap"; MSG="$(pick KICK)"
          elif [ "${SCHED:-}" = "9 20 * * *" ]; then
            TITLE="Coach: letzte Erinnerung"; TAGS="alarm_clock"; MSG="$(pick LATE)"
          else
            TITLE="Coach: Abend-Check-in"; TAGS="memo"; MSG="$(pick CHECKIN)"
          fi

          curl -fsS \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: https://suengerbusiness-source.github.io/Betriebssystem-/" \
            -d "$MSG" \
            "https://ntfy.sh/${NTFY_TOPIC}"
          echo "Gesendet [$TITLE]: $MSG"
