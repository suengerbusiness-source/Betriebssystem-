name: Deploy to GitHub Pages

# Baut die App bei jedem Push und veröffentlicht sie auf GitHub Pages.
# Voraussetzung (einmalig): Repo → Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: ["claude/life-os-mvp-ger9b8", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig, neuere lösen ältere ab.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (mit Pages-Basispfad aus echtem Repo-Namen)
        run: |
          export BASE_PATH="/$(basename "$GITHUB_REPOSITORY")/"
          echo "Basispfad: $BASE_PATH"
          npm run build
      # SPA-Fallback: unbekannte Routen liefern die App-Shell statt 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          # Versucht, GitHub Pages automatisch zu aktivieren (spart den
          # manuellen Schritt, sofern der Plan Pages erlaubt).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
